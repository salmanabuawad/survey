# ---------------------------------------------------------------------------
# Inas kindergarten-teachers survey — survey.kortexd.com
#
#   sudo cp scripts/deploy/nginx/survey.kortexd.com.conf \
#           /etc/nginx/sites-available/survey.kortexd.com
#   sudo ln -sf /etc/nginx/sites-available/survey.kortexd.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate is issued separately with
#   certbot certonly --webroot -w /var/www/html -d survey.kortexd.com
# so that this file stays hand-written rather than certbot-rewritten.
# ---------------------------------------------------------------------------

upstream survey_app {
    server 127.0.0.1:3020 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name survey.kortexd.com;

    # Leave the ACME path reachable so renewals do not need the site down.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2`, not the `http2 on;` directive: this host runs nginx
    # 1.24 and the standalone directive needs 1.25+.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name survey.kortexd.com;

    ssl_certificate     /etc/letsencrypt/live/survey.kortexd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey.kortexd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/survey.access.log;
    error_log  /var/log/nginx/survey.error.log;

    # Free-text answers are capped at 4000 characters each; 2m is ample.
    client_max_body_size 2m;

    # --- security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Next injects inline bootstrap scripts and styles, hence 'unsafe-inline'.
    # Fonts come from Google and are self-hosted at build time by next/font, so
    # no external origin is needed at runtime.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # An anonymous questionnaire needs no device permissions whatsoever.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml font/woff2;

    # --- immutable build output --------------------------------------------
    location /_next/static/ {
        proxy_pass http://survey_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- the CSV export streams; do not buffer it --------------------------
    location /api/admin/export {
        proxy_pass         http://survey_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # --- app ----------------------------------------------------------------
    location / {
        proxy_pass         http://survey_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
